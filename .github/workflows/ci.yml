name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build client
        run: npm run build --prefix client

      - name: Start server (in-memory store)
        run: |
          MONGODB_URI=mongodb://127.0.0.1:1/none PORT=5000 node server/src/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/api/health && break; sleep 1; done

      - name: Smoke test API and signaling
        run: npm run smoke --prefix client -- http://localhost:5000

      - name: Server log
        if: always()
        run: cat server.log || true
